name: validate

on:
  push: { branches: [main] }
  pull_request:

jobs:
  skills:
    name: skills + manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate skill frontmatter, links and routing
        run: node scripts/validate-skills.mjs

  runner:
    name: runner end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install runner
        working-directory: runner
        run: npm install --no-audit --no-fund
      - name: Install browser
        working-directory: runner
        # --with-deps runs apt-get update, which fails on transient mirror hash mismatches.
        # ubuntu-latest already carries the shared libraries, so fall back to the plain install.
        run: npx playwright install --with-deps chromium || npx playwright install chromium
      - name: Serve the demo fixture
        run: |
          python3 -m http.server 8099 --directory examples/demo-app &
          for i in $(seq 1 20); do curl -sf http://localhost:8099/index.html >/dev/null && break; sleep 0.5; done
          curl -sf -o /dev/null -w 'fixture HTTP %{http_code}\n' http://localhost:8099/index.html
      - name: Run the full pipeline against the fixture
        working-directory: runner
        run: node bin/qa-supreme.mjs run --url http://localhost:8099/index.html --out ../.qa-out || true
      - name: Assert the pipeline found the seeded defects
        run: node evals/assert-demo-findings.mjs .qa-out/run.json

      # The fixture is deliberately defective, so every run here exits 1 on its NO-SHIP
      # verdict — that is the product working. The assertions live in the eval steps below.
      - name: Run against the hard fixture
        working-directory: runner
        run: node bin/qa-supreme.mjs crawl --url http://localhost:8099/hard.html --out ../.qa-hard --quiet --maxPages 1 || true

      - name: Assert the hard cases are still handled
        run: node evals/assert-hard-cases.mjs .qa-hard/run.json

      - name: Run against the protected area without credentials
        working-directory: runner
        run: node bin/qa-supreme.mjs run --url http://localhost:8099/dashboard.html --out ../.qa-unauth || true

      - name: Run against the protected area with credentials
        working-directory: runner
        run: |
          node bin/qa-supreme.mjs run --url http://localhost:8099/dashboard.html \
            --login-url http://localhost:8099/login.html --user demo --pass demo123 \
            --out ../.qa-auth || true

      - name: Assert the authenticated path works
        run: node evals/assert-auth-findings.mjs .qa-unauth/run.json .qa-auth/run.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-supreme-demo-report
          path: |
            .qa-out/
            .qa-auth/
            .qa-hard/
          retention-days: 7
