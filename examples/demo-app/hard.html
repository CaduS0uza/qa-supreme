<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hard cases — QA Supreme fixture</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font:15px/1.6 system-ui,sans-serif;margin:0;background:#f6f7fb;color:#111}
header{background:#0b1020;color:#fff;padding:14px 22px;position:sticky;top:0;z-index:10}
main{max-width:820px;margin:20px auto;padding:0 20px}
.card{background:#fff;border:1px solid #e4e7f2;border-radius:10px;padding:18px;margin:14px 0}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #c9d2ea;background:#fff;cursor:pointer;margin:4px 6px 4px 0}
#cookie{position:fixed;left:0;right:0;bottom:0;background:#0b1020;color:#fff;padding:16px 22px;z-index:9999;display:flex;gap:12px;align-items:center}
#overlay{position:absolute;inset:0;background:transparent;z-index:5}
.rel{position:relative}
.menu{position:relative;display:inline-block}
.menu .items{display:none;position:absolute;top:100%;left:0;background:#fff;border:1px solid #c9d2ea;border-radius:8px;padding:6px;z-index:6}
.menu:hover .items{display:block}
.lazy{min-height:60px}
.spacer{height:1400px;display:grid;place-items:center;color:#93a3c4}
iframe{width:100%;height:120px;border:1px solid #e4e7f2;border-radius:8px}
</style></head>
<body>
<header><b>Hard cases</b> · <a href="index.html" style="color:#cbd5f5">Storefront</a></header>
<main>
  <!-- 1. hash routing: three routes, one URL -->
  <div class="card">
    <h2>Hash routes</h2>
    <a href="#/reports">Reports</a> · <a href="#/settings">Settings</a> · <a href="#/team">Team</a>
    <div id="route">route: (none)</div>
  </div>

  <!-- 2. shadow DOM -->
  <div class="card">
    <h2>Web component</h2>
    <my-widget></my-widget>
  </div>

  <!-- 3. same-origin iframe -->
  <div class="card">
    <h2>Embedded frame</h2>
    <iframe src="frame.html" title="Embedded controls"></iframe>
  </div>

  <!-- 4. hover-only menu -->
  <div class="card">
    <h2>Hover menu</h2>
    <div class="menu"><button id="menu-trigger" aria-haspopup="true">Account ▾</button>
      <div class="items"><button id="m-profile">Profile</button><button id="m-billing">Billing</button></div>
    </div>
  </div>

  <!-- 5. control covered by a transparent overlay -->
  <div class="card rel">
    <h2>Covered control</h2>
    <button id="covered">Covered button</button>
    <div id="overlay" title="transparent overlay"></div>
  </div>

  <!-- 6. content that only exists after scrolling -->
  <div class="spacer">↓ scroll down: the next controls do not exist yet ↓</div>
  <div class="card lazy" id="lazy"></div>
</main>

<!-- 7. consent banner covering the bottom of the page -->
<div id="cookie">
  <span>We use cookies.</span>
  <button id="accept-cookies">Accept all</button>
  <button id="reject-cookies">Reject</button>
</div>

<script>
// 1. hash routing
function renderRoute () {
  document.getElementById('route').textContent = 'route: ' + (location.hash || '(none)')
}
addEventListener('hashchange', renderRoute); renderRoute()

// 2. shadow DOM
customElements.define('my-widget', class extends HTMLElement {
  connectedCallback () {
    const r = this.attachShadow({ mode: 'open' })
    r.innerHTML = `<style>button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid #c9d2ea;background:#fff;cursor:pointer;margin-right:6px}</style>
      <button id="shadow-a">Inside shadow DOM</button>
      <button id="shadow-b">Shadow action</button>
      <span id="out"></span>`
    r.getElementById('shadow-a').onclick = () => { r.getElementById('out').textContent = 'shadow clicked' }
  }
})

// 4. hover menu items only work when revealed
document.getElementById('m-profile').onclick = function () { this.textContent = 'Profile ✓' }

// 6. lazy content appears only once the placeholder is scrolled into view
new IntersectionObserver((entries, obs) => {
  entries.forEach(e => {
    if (!e.isIntersecting) return
    e.target.innerHTML = '<h2>Loaded on scroll</h2><button id="lazy-a">Lazy button A</button><button id="lazy-b">Lazy button B</button>'
    document.getElementById('lazy-a').onclick = function () { this.textContent = 'Lazy A ✓' }
    obs.disconnect()
  })
}).observe(document.getElementById('lazy'))

// 7. consent banner
const dismiss = () => { document.getElementById('cookie').remove() }
document.getElementById('accept-cookies').onclick = dismiss
document.getElementById('reject-cookies').onclick = dismiss
</script>
</body></html>
